<h2>Por Capital</h2>
<hr>

<div class="row">
    <div class="col">
        <app-pais-input 
                (onEnter)="buscar( $event )"
                (onDebounce)="sugerencias( $event)"
                placeholder="Buscar capital...">      <!-- Sin corchetes placeholder para enviar dato como variale --> 
        </app-pais-input>
    </div>
</div>

<hr>

<div *ngIf="hayError"
     class="alert alert-danger">
    No se encontró nada con el término {{ termino }}
</div>

<div *ngIf="paises.length > 0" class="row">
    <div class="col">

        <app-pais-tabla [paises]="paises"></app-pais-tabla>    <!-- Le pasamos todo a pais-tabla.component.ts.  lo de servicio paises capitales en capitales -->

    </div>

</div>
